<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>A Little Confession 💗</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #fff;
        background:
            linear-gradient(rgba(48, 4, 28, 0.82), rgba(82, 7, 47, 0.88)),
            url("lilies.jpg") center/cover fixed;
    }

    /* Soft lily-like decorative flowers. Replace lilIes.jpg with your own
       lily background if you have one. */
    body::before,
    body::after {
        content: "✿";
        position: fixed;
        color: rgba(255, 173, 216, 0.20);
        font-size: 180px;
        z-index: -1;
        pointer-events: none;
    }

    body::before {
        left: -45px;
        top: 5%;
        transform: rotate(-20deg);
    }

    body::after {
        right: -45px;
        bottom: 0;
        transform: rotate(25deg);
    }

    .page {
        display: none;
        min-height: 100vh;
        width: 100%;
        padding: 35px 85px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        animation: fadeIn 0.55s ease;
    }

    .page.active {
        display: flex;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(12px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .small-title {
        color: #ffb7d9;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 13px;
        margin-bottom: 12px;
    }

    h1 {
        font-family: Georgia, serif;
        font-size: clamp(32px, 5vw, 58px);
        margin-bottom: 12px;
        text-shadow: 0 4px 20px rgba(255, 60, 150, 0.35);
    }

    .message {
        max-width: 720px;
        line-height: 1.8;
        font-size: clamp(15px, 2vw, 19px);
        color: #ffe8f3;
        margin-bottom: 25px;
    }

    .photo-frame {
        width: min(520px, 72vw);
        height: min(420px, 48vh);
        padding: 10px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 188, 220, 0.45);
        border-radius: 22px;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.45),
            0 0 35px rgba(255, 55, 153, 0.18);
        backdrop-filter: blur(7px);
        margin-bottom: 25px;
    }

    .photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 15px;
        display: block;
        background: #3d0b27;
    }

    .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 25px;
        display: flex;
        justify-content: space-between;
        padding: 0 28px;
        pointer-events: none;
    }

    .arrow {
        pointer-events: auto;
        border: none;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        color: white;
        background: rgba(255, 91, 163, 0.25);
        border: 1px solid rgba(255, 180, 218, 0.5);
        font-size: 28px;
        cursor: pointer;
        transition: 0.25s;
        backdrop-filter: blur(8px);
    }

    .arrow:hover {
        transform: scale(1.12);
        background: #d92c7a;
        box-shadow: 0 0 25px rgba(255, 61, 150, 0.5);
    }

    .dots {
        position: fixed;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
    }

    .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(255, 190, 220, 0.3);
        transition: 0.3s;
    }

    .dot.active {
        width: 27px;
        border-radius: 10px;
        background: #ff71b0;
    }

    /* Final question */
    .question-page {
        position: relative;
    }

    .heart {
        font-size: 70px;
        margin-bottom: 10px;
        animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        15% { transform: scale(1.16); }
        30% { transform: scale(1); }
        45% { transform: scale(1.1); }
    }

    .question {
        font-family: Georgia, serif;
        font-size: clamp(36px, 6vw, 68px);
        margin-bottom: 15px;
    }

    .answer-area {
        position: relative;
        width: min(650px, 90vw);
        height: 190px;
        margin-top: 15px;
    }

    .answer-btn {
        position: absolute;
        top: 55px;
        border: none;
        border-radius: 50px;
        padding: 15px 38px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.25s, box-shadow 0.25s;
    }

    #yesBtn {
        left: 25%;
        color: white;
        background: linear-gradient(135deg, #ff3d91, #b81462);
        box-shadow: 0 8px 30px rgba(255, 36, 132, 0.4);
        z-index: 5;
    }

    #yesBtn:hover {
        transform: scale(1.08);
    }

    #noBtn {
        left: 58%;
        color: #ffd9e9;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255, 180, 218, 0.4);
        z-index: 4;
    }

    .result {
        display: none;
        font-family: Georgia, serif;
        font-size: 32px;
        color: #ffb9d8;
        margin-top: 20px;
    }

    .signature {
        margin-top: 15px;
        font-family: cursive;
        color: #ff9dcc;
        font-size: 24px;
    }

    @media (max-width: 600px) {
        .page {
            padding: 45px 25px 90px;
        }

        .photo-frame {
            width: 86vw;
            height: 42vh;
        }

        .nav {
            padding: 0 15px;
        }

        .arrow {
            width: 48px;
            height: 48px;
        }

        #yesBtn {
            left: 18%;
        }

        #noBtn {
            left: 55%;
        }
    }

    /* =========================================================
       iPHONE / MOBILE OPTIMIZATION
       ========================================================= */
    html {
        width: 100%;
        min-height: 100%;
        background: #30041c;
        -webkit-text-size-adjust: 100%;
    }

    body {
        min-height: 100dvh;
        width: 100%;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    .page {
        min-height: 100dvh;
        height: 100dvh;
        padding:
            max(55px, env(safe-area-inset-top))
            24px
            max(85px, calc(env(safe-area-inset-bottom) + 70px));
        overflow: hidden;
    }

    .small-title {
        font-size: 11px;
        letter-spacing: 2.5px;
        margin-bottom: 9px;
    }

    h1 {
        width: 100%;
        font-size: clamp(29px, 8.5vw, 45px);
        line-height: 1.12;
        margin-bottom: 14px;
    }

    .message {
        width: 100%;
        font-size: 15px;
        line-height: 1.55;
        margin-bottom: 15px;
    }

    .photo-frame {
        width: min(88vw, 390px);
        height: min(48vh, 390px);
        max-height: 390px;
        padding: 7px;
        border-radius: 18px;
        margin-bottom: 15px;
    }

    .photo-frame img {
        border-radius: 12px;
    }

    .nav {
        bottom: max(13px, env(safe-area-inset-bottom));
        padding-left: max(13px, env(safe-area-inset-left));
        padding-right: max(13px, env(safe-area-inset-right));
    }

    .arrow {
        width: 52px;
        height: 52px;
        font-size: 25px;
        -webkit-appearance: none;
    }

    .dots {
        top: max(18px, env(safe-area-inset-top));
    }

    .dot {
        width: 7px;
        height: 7px;
    }

    .dot.active {
        width: 22px;
    }

    .heart {
        font-size: 58px;
        margin-bottom: 5px;
    }

    .question {
        font-size: clamp(34px, 10vw, 48px);
        line-height: 1.08;
    }

    .answer-area {
        width: 92vw;
        max-width: 390px;
        height: 210px;
        margin-top: 8px;
    }

    .answer-btn {
        min-width: 112px;
        min-height: 50px;
        padding: 13px 25px;
        font-size: 16px;
        -webkit-appearance: none;
        -webkit-user-select: none;
        user-select: none;
    }

    #yesBtn {
        left: 8%;
        top: 55px;
    }

    #noBtn {
        left: 58%;
        top: 55px;
    }

    .result {
        font-size: 25px;
        line-height: 1.3;
    }

    .signature {
        font-size: 21px;
    }

    /* Prevent hover behavior from causing problems on iPhone. */
    @media (hover: none) and (pointer: coarse) {
        .arrow:hover,
        #yesBtn:hover {
            transform: none;
            background: inherit;
            box-shadow: inherit;
        }
    }

    @media (max-height: 700px) and (max-width: 600px) {
        .page {
            padding-top: max(45px, env(safe-area-inset-top));
        }

        h1 {
            font-size: clamp(26px, 7.5vw, 38px);
        }

        .photo-frame {
            height: 42vh;
            max-height: 300px;
        }

        .message {
            font-size: 14px;
        }

        .heart {
            font-size: 48px;
        }

        .answer-area {
            height: 175px;
        }
    }

</style>
</head>

<body>

<!-- PAGE 6 -->
<section class="page question-page">
    <div class="heart">💗</div>
    <div class="small-title">One question</div>

    <h1 class="question">Will you be my girlfriend?</h1>

    <p class="message">
        No pressure... except maybe a tiny bit.
    </p>

    <div class="answer-area" id="answerArea">
        <button class="answer-btn" id="yesBtn">YES 💕</button>
        <button class="answer-btn" id="noBtn">NO 😭</button>
    </div>

    <div class="result" id="result">
        I knew you'd say yes! 💗🌸
        <div class="signature">— With love ❤️</div>
    </div>
</section>

<!-- Navigation -->
<div class="nav">
    <button class="arrow" id="prevBtn" aria-label="Previous page">←</button>
    <button class="arrow" id="nextBtn" aria-label="Next page">→</button>
</div>

<div class="dots" id="dots"></div>

<script>
    const pages = document.querySelectorAll(".page");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dots = document.getElementById("dots");

    let currentPage = 0;

    // Create page indicator dots
    pages.forEach((_, index) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        if (index === 0) dot.classList.add("active");

        dot.addEventListener("click", () => {
            currentPage = index;
            showPage(currentPage);
        });

        dots.appendChild(dot);
    });

    function showPage(index) {
        pages.forEach((page, i) => {
            page.classList.toggle("active", i === index);
        });

        document.querySelectorAll(".dot").forEach((dot, i) => {
            dot.classList.toggle("active", i === index);
        });

        prevBtn.style.visibility = index === 0 ? "hidden" : "visible";
        nextBtn.style.visibility = index === pages.length - 1 ? "hidden" : "visible";
    }

    nextBtn.addEventListener("click", () => {
        if (currentPage < pages.length - 1) {
            currentPage++;
            showPage(currentPage);
        }
    });

    prevBtn.addEventListener("click", () => {
        if (currentPage > 0) {
            currentPage--;
            showPage(currentPage);
        }
    });

    // Swipe navigation for iPhone
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener("touchstart", (event) => {
        touchStartX = event.changedTouches[0].screenX;
        touchStartY = event.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener("touchend", (event) => {
        const touchEndX = event.changedTouches[0].screenX;
        const touchEndY = event.changedTouches[0].screenY;
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;

        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0 && currentPage < pages.length - 1) {
                currentPage++;
                showPage(currentPage);
            } else if (dx > 0 && currentPage > 0) {
                currentPage--;
                showPage(currentPage);
            }
        }
    }, { passive: true });

    // Keyboard navigation
    document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && currentPage < pages.length - 1) {
            currentPage++;
            showPage(currentPage);
        }

        if (event.key === "ArrowLeft" && currentPage > 0) {
            currentPage--;
            showPage(currentPage);
        }
    });

    // =========================================================
    // FINAL PAGE: THE "NO" BUTTON ESCAPES
    // =========================================================

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const answerArea = document.getElementById("answerArea");
    const result = document.getElementById("result");

    let yesScale = 1;

    function moveNoButton() {
        const areaRect = answerArea.getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();

        const padding = 5;
        const maxX = Math.max(padding, areaRect.width - btnRect.width - padding);
        const maxY = Math.max(padding, areaRect.height - btnRect.height - padding);

        let x = padding + Math.random() * Math.max(0, maxX - padding);
        let y = padding + Math.random() * Math.max(0, maxY - padding);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        // Make YES bigger
        yesScale += 0.12;
        yesBtn.style.transform = `scale(${yesScale})`;
    }

    // Clicking NO makes it run away.
    noBtn.addEventListener("click", moveNoButton);

    // On desktop, make NO escape when the cursor gets close.
    noBtn.addEventListener("mouseenter", moveNoButton);

    // On phones, touch also makes it escape.
    noBtn.addEventListener("touchstart", (event) => {
        event.preventDefault();
        moveNoButton();
    }, { passive: false });

    yesBtn.addEventListener("click", () => {
        result.style.display = "block";
        answerArea.style.display = "none";
        yesBtn.style.transform = "scale(1.4)";
        document.querySelector(".question").textContent = "YAY! 💕";
        document.querySelector(".question-page .message").textContent =
            "You just made me the happiest person. Let's make some beautiful memories together. 🌸";
    });

    showPage(0);
</script>

</body>
</html>
